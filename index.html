<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CineStream HD</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: sans-serif; background: #111; color: white; padding-bottom: 30px; }
        header { background: #000; padding: 15px; display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #e50914; }
        .logo { color: #e50914; font-size: 20px; font-weight: bold; }
        .search-box { padding: 8px 12px; border-radius: 20px; border: none; background: #222; color: white; }
        .categories { display: flex; gap: 8px; overflow-x: auto; padding: 12px; background: #181818; }
        .cat-btn { background: #333; color: white; border: none; padding: 6px 14px; border-radius: 12px; cursor: pointer; white-space: nowrap; }
        .cat-btn.active { background: #e50914; }
        .container { padding: 15px; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 12px; }
        .card { background: #222; border-radius: 6px; overflow: hidden; cursor: pointer; text-align: center; transition: 0.2s; }
        .card:hover { transform: scale(1.03); }
        .card img { width: 100%; height: 190px; object-fit: cover; }
        .card-title { font-size: 12px; padding: 6px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); justify-content: center; align-items: center; z-index: 1000; }
        .modal-box { position: relative; width: 90%; max-width: 400px; background: #222; border-radius: 8px; padding: 25px; text-align: center; }
        .close-btn { position: absolute; top: 8px; right: 15px; color: #fff; font-size: 24px; cursor: pointer; }
        .play-btn { background: #e50914; color: white; border: none; padding: 12px 24px; font-size: 16px; font-weight: bold; border-radius: 25px; cursor: pointer; margin-top: 15px; text-decoration: none; display: inline-block; }
    </style>
</head>
<body>

    <header>
        <div class="logo">CineStream HD</div>
        <input type="text" id="searchInput" class="search-box" placeholder="Search...">
    </header>

    <div class="categories">
        <button class="cat-btn active" onclick="loadCategory('popular', 'Movies', this)">🔥 Popular</button>
        <button class="cat-btn" onclick="loadHindi(this)">🇮🇳 Hindi Dubbed</button>
        <button class="cat-btn" onclick="loadSeries(this)">📺 Web Series</button>
    </div>

    <div class="container">
        <div id="movieGrid" class="grid">Loading...</div>
    </div>

    <div id="playerModal" class="modal">
        <div class="modal-box">
            <span class="close-btn" onclick="closePlayer()">&times;</span>
            <h3 id="modalTitle" style="margin-bottom:10px;">Movie Title</h3>
            <p style="font-size:13px; color:#ccc;">Click below to stream movie in HD quality.</p>
            <a id="watchBtn" href="#" target="_blank" class="play-btn">▶ Watch Movie</a>
        </div>
    </div>

    <script>
        const API_KEY = 'c9bae2023e6063ccc07c529d9d0eeea4';
        const grid = document.getElementById('movieGrid');

        function renderItems(items, isSeries = false) {
            grid.innerHTML = '';
            items.forEach(item => {
                if(!item.poster_path) return;
                const card = document.createElement('div');
                card.className = 'card';
                const name = item.title || item.name;
                const type = isSeries ? 'tv' : 'movie';
                card.onclick = () => openPlayer(item.id, name, type);
                card.innerHTML = `
                    <img src="https://image.tmdb.org/t/p/w500${item.poster_path}">
                    <div class="card-title">${name}</div>
                `;
                grid.appendChild(card);
            });
        }

        async function fetchData(url, isSeries = false) {
            grid.innerHTML = 'Loading...';
            const res = await fetch(url);
            const data = await res.json();
            renderItems(data.results, isSeries);
        }

        function loadCategory(type, label, btn) {
            setActive(btn);
            fetchData(`https://api.themoviedb.org/3/movie/${type}?api_key=${API_KEY}`);
        }

        function loadHindi(btn) {
            setActive(btn);
            fetchData(`https://api.themoviedb.org/3/discover/movie?api_key=${API_KEY}&with_original_language=hi`);
        }

        function loadSeries(btn) {
            setActive(btn);
            fetchData(`https://api.themoviedb.org/3/tv/popular?api_key=${API_KEY}`, true);
        }

        function setActive(btn) {
            document.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('active'));
            if(btn) btn.classList.add('active');
        }

        document.getElementById('searchInput').addEventListener('keyup', (e) => {
            if(e.target.value.length > 2) {
                fetchData(`https://api.themoviedb.org/3/search/multi?api_key=${API_KEY}&query=${e.target.value}`);
            }
        });

        function openPlayer(id, name, type) {
            document.getElementById('modalTitle').innerText = name;
            const embedUrl = type === 'tv' 
                ? `https://vidsrc.me/embed/tv?tmdb=${id}&season=1&episode=1`
                : `https://vidsrc.me/embed/movie?tmdb=${id}`;
            document.getElementById('watchBtn').href = embedUrl;
            document.getElementById('playerModal').style.display = 'flex';
        }

        function closePlayer() {
            document.getElementById('playerModal').style.display = 'none';
        }

        loadCategory('popular', 'Popular', null);
    </script>
</body>
</html>
