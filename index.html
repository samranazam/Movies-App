<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Movie Box</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #141414; color: white; text-align: center; margin: 0; padding: 20px; }
        h1 { color: #e50914; }
        .movie-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 15px; padding: 20px; }
        .movie-card { background: #222; padding: 10px; border-radius: 8px; }
        .movie-card img { width: 100%; border-radius: 5px; }
        .movie-title { font-size: 14px; margin-top: 8px; }
    </style>
</head>
<body>
    <h1>Movie Box</h1>
    <div id="movies" class="movie-grid">Loading movies...</div>

    <script>
        const API_KEY = 'c9bae2023e6063ccc07c529d9d0eeea4';
        const API_URL = `https://api.themoviedb.org/3/movie/popular?api_key=${API_KEY}`;

        async function getMovies() {
            const res = await fetch(API_URL);
            const data = await res.json();
            const container = document.getElementById('movies');
            container.innerHTML = '';
            
            data.results.forEach(movie => {
                const card = document.createElement('div');
                card.className = 'movie-card';
                card.innerHTML = `
                    <img src="https://image.tmdb.org/t/p/w500${movie.poster_path}" alt="${movie.title}">
                    <div class="movie-title">${movie.title}</div>
                `;
                container.appendChild(card);
            });
        }
        getMovies();
    </script>
</body>
</html>
